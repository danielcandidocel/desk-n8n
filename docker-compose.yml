services:
  postgres:
    image: postgres:16-alpine
    container_name: desk_n8n_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    container_name: desk_n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5678}:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "/files/scripts/n8n-start.sh"]
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-this}
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      N8N_PERSONALIZATION_ENABLED: ${N8N_PERSONALIZATION_ENABLED:-false}
      N8N_TEMPLATES_ENABLED: ${N8N_TEMPLATES_ENABLED:-false}
      N8N_VERSION_NOTIFICATIONS_ENABLED: ${N8N_VERSION_NOTIFICATIONS_ENABLED:-false}
      N8N_DEFAULT_BINARY_DATA_MODE: ${N8N_DEFAULT_BINARY_DATA_MODE:-filesystem}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_RUNNERS_ENABLED: ${N8N_RUNNERS_ENABLED:-true}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-admin123}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-n8n}
      DB_POSTGRESDB_SCHEMA: public
      GENERIC_TIMEZONE: Europe/Lisbon
      TZ: Europe/Lisbon
      DESK_APP_URL: ${DESK_APP_URL:-http://nginx}
      DESK_APP_WEBHOOK_SECRET: ${DESK_APP_WEBHOOK_SECRET:-}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-desk}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-desk}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/desk}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-desk.events}
      VIRTUAL_AGENT_REQUEST_QUEUE: ${VIRTUAL_AGENT_REQUEST_QUEUE:-virtual-agent-requests}
      VIRTUAL_AGENT_RESPONSE_QUEUE: ${VIRTUAL_AGENT_RESPONSE_QUEUE:-virtual-agent-responses}
      COPILOT_REQUEST_QUEUE: ${COPILOT_REQUEST_QUEUE:-copilot-requests}
      COPILOT_RESPONSE_QUEUE: ${COPILOT_RESPONSE_QUEUE:-copilot-responses}
    volumes:
      - ./credentials:/files/credentials:ro
      - n8n_data:/home/node/.n8n
      - ./workflows:/files/workflows:ro
      - ./scripts:/files/scripts:ro
    networks:
      - default
      - desk_shared

volumes:
  n8n_data:
  n8n_postgres_data:

networks:
  desk_shared:
    external: true
    name: desk_shared
